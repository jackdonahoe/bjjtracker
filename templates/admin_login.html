{% extends "base.html" %}
{% block content %}
<h1>Admin Login</h1>

{% if error %}
<p>{{ error }}</p>
{% endif %}

<form method="post" action="/admin/login">
    <label>
        Email
        <input type="email" name="email" required>
    </label>

    <label>
        Password
        <input type="password" name="password" required>
    </label>

    <button type="submit">Log In</button>
</form>
{% endblock %}
