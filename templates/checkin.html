{% extends "base.html" %}
{% block content %}
<h1>Check In</h1>

<form method="post" action="/checkin">
    <input type="text" id="name-input" autocomplete="off" placeholder="Type your name">
    <input type="hidden" id="person-id" name="person_id">
    <ul id="suggestions"></ul>
    <button type="submit">Check In</button>
</form>

<script src="/static/checkin.js"></script>
{% endblock %}
