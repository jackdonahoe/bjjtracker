{% extends "base.html" %}
{% block content %}
<h1>{{ session.held_at.strftime("%b %-d, %Y") }}</h1>
<p><a href="/admin/sessions">All sessions</a></p>

<table>
    <tr>
        <th>Name</th>
        <th>Email</th>
    </tr>
    {% for person in attendance %}
    <tr>
        <td>{{ person.full_name }}</td>
        <td>{{ person.email or "—" }}</td>
    </tr>
    {% endfor %}
</table>
{% if not attendance %}
<p>Nobody checked in this session.</p>
{% endif %}
{% endblock %}
